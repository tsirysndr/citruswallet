<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f3f0" />
    <title>You’re offline · Peachlet</title>
    <link rel="stylesheet" href="/offline.css" />
    <link rel="icon" href="/favicon.svg" />
  </head>
  <body>
    <main>
      <img src="/favicon.svg" width="64" height="64" alt="Peachlet" />
      <p class="eyebrow">A LITTLE PAUSE.</p>
      <h1>Let’s reconnect.</h1>
      <p>
        Peachlet needs an internet connection to load your activity and check
        payments. Your account data isn’t saved for offline access.
      </p>
      <p>
        If you just approved a transfer, check MetaMask’s transaction history
        before trying again.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
