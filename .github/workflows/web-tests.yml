name: Web tests

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - "vitest.config.ts"
      - ".github/workflows/web-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: React component tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Type-check frontend
        run: bunx --no-install tsc -p web
      - name: Run React Testing Library tests
        run: bun run test:web
